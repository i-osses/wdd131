<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Review</title>
  <meta name="author" content="Ignacio Osses">
  <meta name="description" content="form for product review page">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
</head>

<body>
  <header>
    <h1>Product Review</h1>
  </header>

  <main>
    <form action="review.html" method="get">
      <label for="productName">Select Product:</label>
      <select id="productName" name="productName" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <div class="product">
        <p>Overall Rating</p>
        <div class="radio-star">
          <label for="star1">&star;</label>
          <label for="star2">&star;&star;</label>
          <label for="star3">&star;&star;&star;</label>
          <label for="star4">&star;&star;&star;&star;</label>
          <label for="star5">&star;&star;&star;&star;&star;</label>
          <input type="radio" id="star1" name="star" required>
          <input type="radio" id="star2" name="star" required>
          <input type="radio" id="star3" name="star" required>
          <input type="radio" id="star4" name="star" required>
          <input type="radio" id="star5" name="star" required>
        </div>
      </div>

      <label for="installDate">Date of Installation:</label>
      <input type="date" id="installDate" name="installDate" required>

      <div class="features">
        <H4>Which features did you find useful in the product?</H4>
        <p>(Check all that apply)</p>
        <br>
        <label><input type="checkbox" id="durability" name="durability" value="durability"> Durability</label>
        <label><input type="checkbox" id="easy_use" name="easy_use" value="easy_use"> Ease of Use</label>
        <label><input type="checkbox" id="performance" name="performance" value="performance"> Performance</label>
        <label><input type="checkbox" id="design" name="design" value="design"> Design</label>
      </div>

      <label for="writtenReview">Written Review:</label>
      <textarea id="writtenReview" name="writtenReview"></textarea>

      <label for="userName">Your Name:</label>
      <input type="text" id="userName" name="userName">

      <input type="submit" value="Review">
    </form>
  </main>

  <footer>
    <p>© <span id="currentyear"> </span> - Ignacio Osses - Chile</p>
    <p>Last Modification: <span id="lastmodify"></span></p>
  </footer>

</body>

</html>
